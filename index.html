<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio AS – Agendamento</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050505;--card:#111111;--tx:#d4af37;--mut:#f0d57a;--ac:#d4af37;--acx:#0a0a0a;--bd:#a67c00;--sel:#1a160d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505;--card:#111111;--tx:#d4af37;--mut:#f0d57a;--ac:#d4af37;--acx:#0a0a0a;--bd:#a67c00;--sel:#1a160d}}
:root[data-theme="dark"]{--bg:#050505;--card:#111111;--tx:#d4af37;--mut:#f0d57a;--ac:#d4af37;--acx:#0a0a0a;--bd:#a67c00;--sel:#1a160d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0;color:var(--tx)}
.sub{color:var(--mut);margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(212,175,55,.12)}
h2{font-size:1rem;margin:0 0 10px;color:var(--ac)}
label{display:block;font-size:.9rem;margin:10px 0 4px;color:var(--tx)}
select,input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:#090909;color:var(--tx);font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{padding:11px 8px;border:1px solid var(--bd);border-radius:10px;background:#0d0d0d;color:var(--tx);font-size:.95rem;cursor:pointer;text-align:center}
.opt.on{background:var(--sel);border-color:var(--ac);font-weight:600}
.opt:disabled{opacity:.4}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 0 12px rgba(212,175,55,.35)}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);box-shadow:none}
.sum{white-space:pre-wrap;background:var(--sel);border-radius:12px;padding:12px;font-size:.95rem;color:var(--tx)}
.note{color:var(--mut);font-size:.85rem;margin-top:10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>✨ Studio AS</h1>
<p class="sub">Agende seu horário · Todos os dias, 9h às 18h · Pix e cartão</p>

<div class="card">
<h2>1. Serviço</h2>
<select id="svc"></select>
<p class="note" id="price"></p>
</div>

<div class="card">
<h2>2. Dia</h2>
<select id="day"></select>
<h2 style="margin-top:14px">3. Horário (2 horas)</h2>
<div class="grid" id="slots"></div>
</div>

<div class="card">
<h2>4. Seus dados</h2>
<label for="nm">Nome</label><input id="nm" autocomplete="name">
<label for="tel">WhatsApp</label><input id="tel" type="tel" autocomplete="tel" placeholder="(83) 9 0000-0000">
</div>

<button class="btn" id="go">Solicitar agendamento</button>

<div class="card hide" id="out" style="margin-top:14px">
<h2>Pedido pronto</h2>
<div class="sum" id="msg"></div>
<a id="wa" class="btn hide" style="display:block;text-align:center;text-decoration:none">Enviar pelo WhatsApp</a>
<button class="btn sec" id="cp">Copiar mensagem</button>
<p class="note">O horário só fica confirmado depois que o Studio AS responder.</p>
</div>
</main>
<script>
var WHATSAPP = "";
var SERVICES = [
["Escova – P",25],["Escova – M",30],["Escova – G",35],["Corte + Escova (à vista)",50],
["Selagem – P",150],["Selagem – M",200],["Selagem – G",250],
["Mechas – P",150],["Mechas – M",200],["Mechas – G",250],
["Hidratação",25],["Reconstrução",50],["Coloração",50],
["Sobrancelha",20],["Sobrancelha + Henna (à vista)",35],["Henna",30],
["Cílios",70],["Maquiagem",50],["Penteado",70],["Micropigmentação",250],
["Depilação – Buço",10],["Depilação – Axila",20],["Depilação – Meia perna",20],
["Depilação – Perna completa",40],["Depilação – Face",50]];
var HOURS=[9,11,13,15], WD=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
var $=function(i){return document.getElementById(i)}, hour=null;
var svc=$("svc"), day=$("day");
SERVICES.forEach(function(s,i){var o=document.createElement("option");o.value=i;o.textContent=s[0];svc.appendChild(o)});
function upd(){$("price").textContent="Valor: R$ "+SERVICES[svc.value][1]+" · Pix ou cartão"}
svc.onchange=upd;upd();
function pad(n){return n<10?"0"+n:""+n}
var now=new Date();
for(var i=0;i<14;i++){
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
  var o=document.createElement("option");
  o.value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  o.textContent=(i==0?"Hoje – ":i==1?"Amanhã – ":"")+WD[d.getDay()]+", "+pad(d.getDate())+"/"+pad(d.getMonth()+1);
  day.appendChild(o);
}
function drawSlots(){
  var el=$("slots");el.innerHTML="";hour=null;
  var today=day.selectedIndex==0;
  HOURS.forEach(function(h){
    var b=document.createElement("button");b.type="button";b.className="opt";
    b.textContent=h+"h às "+(h+2)+"h";
    if(today&&now.getHours()>=h)b.disabled=true;
    b.onclick=function(){hour=h;[].forEach.call(el.children,function(c){c.classList.remove("on")});b.classList.add("on")};
    el.appendChild(b);
  });
}
day.onchange=drawSlots;drawSlots();
var text="";
$("go").onclick=function(){
  var n=$("nm").value.trim(),t=$("tel").value.trim();
  if(!n||!t){alert("Preencha nome e WhatsApp.");return}
  if(hour===null){alert("Escolha um horário.");return}
  var s=SERVICES[svc.value],dt=day.options[day.selectedIndex].textContent.replace(/^(Hoje|Amanhã) – /,"");
  text="Olá, Studio AS! Gostaria de agendar:\n\n💇‍♀️ Serviço: "+s[0]+"\n📅 Dia: "+dt+"\n🕘 Horário: "+hour+"h às "+(hour+2)+"h\n💰 Valor: R$ "+s[1]+"\n👤 Nome: "+n+"\n📱 WhatsApp: "+t;
  $("msg").textContent=text;$("out").classList.remove("hide");
  var wa=$("wa");
  if(WHATSAPP){wa.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(text);wa.target="_blank";wa.classList.remove("hide")}
  $("out").scrollIntoView({behavior:"smooth"});
};
$("cp").onclick=function(){
  var done=function(){$("cp").textContent="Copiado ✓"};
  try{navigator.clipboard.writeText(text).then(done,function(){alert("Selecione e copie o texto acima.")})}
  catch(e){alert("Selecione e copie o texto acima.")}
};
</script>
</body>
</html>
